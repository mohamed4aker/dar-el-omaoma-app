name: dar_el_omouma
description: "Dar El Omouma Hospital — patient and doctor mobile application."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^17.0.0
  provider: ^6.1.2
  intl: any
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed/hospital_data.json
    - assets/brand/mark.png
    - assets/brand/logo_full.png
  # Cairo (SIL Open Font License, assets/fonts/Cairo-OFL.txt): a clean
  # Arabic face close to the hospital's printed material, bundled so every
  # phone shows the same type.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
